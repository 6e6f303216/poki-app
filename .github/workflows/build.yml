name: Build Poki APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f Poki.html ]; then
            cp Poki.html www/index.html
          elif [ -f index.html ]; then
            cp index.html www/index.html
          else
            cp *.html www/index.html
          fi

      - name: Build Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          npx cap init "Poki" "com.mimute.poki" --web-dir www
          npx cap add android

          # Нарезка иконки через предустановленный ffmpeg
          if [ -f icon.png ]; then
            mkdir -p assets
            ffmpeg -y -i icon.png -vf scale=1024:1024 assets/icon-only.png
            cp assets/icon-only.png assets/icon-foreground.png
            npx @capacitor/assets generate --android || true
          fi

          # Сетевые права и портретная ориентация
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' "$MANIFEST"

          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poki-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
