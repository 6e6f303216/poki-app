name: Build Poki APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f Poki.html ]; then
            cp Poki.html www/index.html
          elif [ -f index.html ]; then
            cp index.html www/index.html
          else
            cp *.html www/index.html
          fi

      - name: Build Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          npx cap init "Poki" "com.mimute.poki" --web-dir www
          npx cap add android

          # Генерация адаптивных иконок (fore/back/only)
          if [ -f icon.png ]; then
            pip install pillow
            mkdir -p assets
            python3 -c "
          from PIL import Image
          im = Image.open('icon.png').convert('RGBA').resize((1024, 1024))
          im.save('assets/icon-only.png')
          im.save('assets/icon-foreground.png')
          bg = Image.new('RGBA', (1024, 1024), (15, 23, 42, 255))
          bg.save('assets/icon-background.png')
          "
            npx @capacitor/assets generate --android || true
          fi

          # Сетевые права и портретная ориентация
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' "$MANIFEST"

          # Фикс дубликатов классов Kotlin через BOM
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poki-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
